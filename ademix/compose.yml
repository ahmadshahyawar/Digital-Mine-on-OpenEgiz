# Ademix Mine: contest solution overlay for the OpenEgiz Compose stack.

services:
  ademix-setup:
    build:
      context: ../../ademix
      dockerfile: simulator/Dockerfile
    image: ademix/mine-simulator:local
    restart: "no"
    command: ["python", "setup_twins.py"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully

  ademix-simulator:
    image: ademix/mine-simulator:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-20}
    ports:
      - "${OPENEGIZ_BIND:-127.0.0.1}:${ADEMIX_API_PORT:-8088}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      ademix-setup:
        condition: service_completed_successfully

  ademix-ui:
    build: ../../ademix/frontend
    image: ademix/mine-ui:local
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "${OPENEGIZ_BIND:-127.0.0.1}:${ADEMIX_UI_PORT:-4173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      ademix-simulator:
        condition: service_healthy

