name: Bug report
description: Report a reproducible problem in Ademix
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Ademix. Please remove credentials and private operational data before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the commands, scenario and UI actions needed to reproduce the problem.
      placeholder: |
        1. Start the stack with ...
        2. Open ...
        3. Trigger ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Docker startup
        - Eclipse Ditto or MQTT integration
        - Simulation or Smart Dispatch
        - 3D frontend
        - Data or documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker version and browser.
      placeholder: Ubuntu 24.04, Docker 29, Firefox 145
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only the smallest useful excerpt. Do not include secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private data from the report.
          required: true
